<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>SongScan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%231ed760'/%3E%3C/svg%3E">
<style>
  :root { --bg:#111; --fg:#f4f4f4; --dim:#9a9a9a; --accent:#1ed760; --warn:#ffb347; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:18px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  section { min-height:100%; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:20px; padding:24px 16px; text-align:center; }
  [hidden] { display:none !important; }
  h1 { margin:0; font-size:28px; letter-spacing:.02em; }
  p { margin:0; max-width:28em; }
  .dim { color:var(--dim); font-size:15px; }
  button, .btn { appearance:none; border:0; border-radius:999px; background:var(--accent);
    color:#000; font:inherit; font-weight:700; padding:16px 32px; min-width:200px;
    text-decoration:none; cursor:pointer; display:inline-block; }
  button.secondary, .btn.secondary { background:#2a2a2a; color:var(--fg); }
  button:disabled { opacity:.45; }
  #play-btn { width:min(70vw, 280px); height:min(70vw, 280px); font-size:40px; }
  #count { font-size:min(60vw, 320px); font-weight:800; line-height:1; }
  #scan { justify-content:flex-start; }
  #viewfinder { position:relative; width:min(92vw, 480px); aspect-ratio:1; border-radius:16px;
    overflow:hidden; background:#000; }
  #video { width:100%; height:100%; object-fit:cover; }
  #viewfinder::after { content:""; position:absolute; inset:15%; border:3px solid rgba(255,255,255,.7);
    border-radius:12px; }
  #toast { min-height:1.4em; color:var(--warn); font-weight:600; }
</style>
</head>
<body>

<section id="scan" hidden>
  <h1>Scan a card</h1>
  <div id="viewfinder"><video id="video" playsinline muted></video></div>
  <p id="toast" role="status"></p>
  <p class="dim">Plays each card's song in the Spotify app on this phone.</p>
</section>

<section id="ready" hidden>
  <p id="ready-card" class="dim"></p>
  <button id="play-btn" type="button">Play</button>
  <p class="dim">Tap Play, then turn the phone face down.</p>
  <button id="cancel-btn" class="secondary" type="button">Scan another card</button>
</section>

<section id="countdown" hidden>
  <div id="count" aria-live="assertive">3</div>
</section>

<section id="playing" hidden>
  <h1>Playing</h1>
  <button id="next-btn" type="button">Next card</button>
  <a id="replay" class="btn secondary" href="spotify:">Song didn't start? Play it</a>
</section>

<!-- Bump ?v= whenever app.js changes: Pages lets browsers cache it for 10 min, and a fresh
     index.html with a stale app.js gives buttons without handlers. -->
<script src="app.js?v=8"></script>
</body>
</html>
