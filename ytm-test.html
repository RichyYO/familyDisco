<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111">
<title>YouTube Link Test</title>
<!-- Throwaway test page (2026-11-17): which YouTube link form starts the song by itself on a phone.
     Delete once the winner is in app.js. -->
<style>
  :root { --bg:#111; --fg:#f4f4f4; --dim:#9a9a9a; --accent:#1ed760; --row:#1c1c1c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); padding:16px;
    font:16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size:22px; margin:0 0 4px; }
  p { margin:0 0 12px; color:var(--dim); font-size:14px; }
  .row { background:var(--row); border-radius:12px; padding:12px; margin:0 0 10px; }
  .name { font-weight:700; }
  .url { color:var(--dim); font-size:12px; word-break:break-all; margin:2px 0 8px; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; }
  a.btn, button { appearance:none; border:0; border-radius:999px; background:var(--accent); color:#000;
    font:inherit; font-weight:700; padding:10px 16px; text-decoration:none; cursor:pointer; }
  button.secondary { background:#2a2a2a; color:var(--fg); }
  select { font:inherit; background:#2a2a2a; color:var(--fg); border:0; border-radius:8px; padding:8px; }
  label { display:block; margin:0 0 12px; font-size:14px; color:var(--dim); }
  input { font:inherit; background:#2a2a2a; color:var(--fg); border:0; border-radius:8px; padding:8px; width:10em; }
  textarea { width:100%; height:9em; background:#000; color:var(--fg); border:0; border-radius:8px;
    font:12px/1.4 ui-monospace, Consolas, monospace; padding:8px; }
  #count { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center;
    justify-content:center; font-size:40vw; font-weight:800; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<h1>YouTube link test</h1>
<p>Tap each link, then come back and mark what happened. "Tap" opens the link straight away;
  "After 3 s" opens it the way the game does, 3 s after the tap. Marks are saved on this phone.</p>
<label>Song ID <input id="song" spellcheck="false"> video ID <input id="video" spellcheck="false"></label>
<div id="rows"></div>
<button class="secondary" id="copy">Copy results</button>
<p></p>
<textarea id="out" readonly></textarea>
<div id="count" hidden></div>

<script>
'use strict';
// Defaults: card 0001 of the test deck. Song = its YouTube Music Song (Art Track) ID from test.csv;
// video = the music-video ID it used before (opened on the Video tab and waited, 2026-11-16).
const DEFAULT_SONG = 'lYBUbBu4W08';
const DEFAULT_VIDEO = 'dQw4w9WgXcQ';
const KEY = 'songscan.ytmtest';
const YTM = 'com.google.android.apps.youtube.music';

const VARIANTS = [
  { key: 'ytm-song',   name: 'YT Music, song ID (game today)',  url: (s) => `https://music.youtube.com/watch?v=${s}` },
  { key: 'ytm-video',  name: 'YT Music, video ID (control)',    url: (s, v) => `https://music.youtube.com/watch?v=${v}` },
  { key: 'ytm-queue',  name: 'YT Music, song as radio queue',   url: (s) => `https://music.youtube.com/watch?v=${s}&list=RDAMVM${s}` },
  { key: 'ytm-intent', name: 'YT Music, Android intent',        url: (s) => `intent://music.youtube.com/watch?v=${s}#Intent;scheme=https;package=${YTM};end` },
  { key: 'yt-watch',   name: 'YouTube, youtube.com/watch',      url: (s) => `https://www.youtube.com/watch?v=${s}` },
  { key: 'yt-short',   name: 'YouTube, youtu.be',               url: (s) => `https://youtu.be/${s}` },
  { key: 'yt-vnd',     name: 'YouTube, vnd.youtube: scheme',    url: (s) => `vnd.youtube:${s}` },
];
const OUTCOMES = ['', 'played by itself', 'opened, waited for tap', 'opened browser tab', 'nothing happened', 'other'];

const $ = (s) => document.querySelector(s);
let marks = {};
try { marks = JSON.parse(localStorage.getItem(KEY)) || {}; } catch { marks = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(marks)); } catch { /* private mode */ } };

const params = new URLSearchParams(location.search);
$('#song').value = params.get('song') || DEFAULT_SONG;
$('#video').value = params.get('video') || DEFAULT_VIDEO;
const link = (v) => v.url($('#song').value.trim(), $('#video').value.trim());

function render() {
  const rows = $('#rows');
  rows.textContent = '';
  for (const v of VARIANTS) {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<div class="name"></div><div class="url"></div><div class="btns">
      <a class="btn">Tap</a><button class="secondary">After 3 s</button></div>`;
    row.querySelector('.name').textContent = v.name;
    row.querySelector('.url').textContent = link(v);
    row.querySelector('a').href = link(v);
    row.querySelector('button').onclick = () => delayed(v);
    for (const how of ['tap', '3s']) {
      const sel = document.createElement('select');
      for (const o of OUTCOMES) sel.add(new Option(o ? `${how}: ${o}` : `${how}: not tried`, o));
      sel.value = marks[`${v.key} ${how}`] || '';
      sel.onchange = () => { marks[`${v.key} ${how}`] = sel.value; save(); summary(); };
      row.querySelector('.btns').append(sel);
    }
    rows.append(row);
  }
  summary();
}

async function delayed(v) {
  const c = $('#count');
  c.hidden = false;
  for (let n = 3; n >= 1; n--) { c.textContent = n; await new Promise((r) => setTimeout(r, 1000)); }
  c.hidden = true;
  location.href = link(v);
}

function summary() {
  const lines = [`ua: ${navigator.userAgent}`, `song ${$('#song').value} video ${$('#video').value}`];
  for (const v of VARIANTS) for (const how of ['tap', '3s']) {
    const m = marks[`${v.key} ${how}`];
    if (m) lines.push(`${v.key} ${how}: ${m}`);
  }
  $('#out').value = lines.join('\n');
}

$('#song').onchange = $('#video').onchange = render;
$('#copy').onclick = async () => {
  try { await navigator.clipboard.writeText($('#out').value); $('#copy').textContent = 'Copied'; }
  catch { $('#out').select(); }
};
render();
</script>
</body>
</html>
